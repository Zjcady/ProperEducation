<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Study Coach</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2563eb; --accent-soft: #e8efff;
    --new: #cbd5e1; --learning: #f59e0b; --review: #3b82f6; --mastered: #16a34a;
    --easy: #15803d; --medium: #b45309; --hard: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b22; --text: #e6e8ee; --muted: #9aa1ad; --line: #272b34;
      --accent: #7aa2ff; --accent-soft: #1c2740;
      --new: #3a4150; --learning: #d9962b; --review: #5b8def; --mastered: #3fb562;
      --easy: #4ade80; --medium: #fbbf24; --hard: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 16px; }
  header h1 { font-size: 1.25rem; margin: 0; }
  .streak { color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .kind { display: inline-block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .kind.review { background: color-mix(in srgb, var(--review) 18%, transparent); color: var(--review); }
  .kind.continue { background: color-mix(in srgb, var(--learning) 18%, transparent); color: var(--learning); }
  .kind.mock { background: color-mix(in srgb, var(--hard) 14%, transparent); color: var(--hard); }
  h2 { font-size: 1.35rem; margin: 8px 0 2px; line-height: 1.25; }
  .meta { color: var(--muted); font-size: .92rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .diff { font-weight: 600; text-transform: capitalize; }
  .diff.easy { color: var(--easy); } .diff.medium { color: var(--medium); } .diff.hard { color: var(--hard); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
  .btn { display: inline-block; padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 600;
    background: var(--accent); color: #fff; min-height: 44px; line-height: 24px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .ritual { margin: 12px 0 0; padding: 12px 14px; background: var(--bg); border-radius: 10px; font-size: .95rem; }
  .ritual code { font-size: .88rem; }
  .ritual ol { margin: 6px 0 0 18px; padding: 0; } .ritual li { margin: 3px 0; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 1.3rem; }
  details[open] > summary::after { content: "–"; }
  .md h1 { font-size: 1.15rem; margin: 6px 0; } .md h2 { font-size: 1.02rem; margin: 16px 0 4px; }
  .md p, .md ul, .md ol { margin: 6px 0; } .md ul, .md ol { padding-left: 22px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: .86rem; line-height: 1.45; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .md details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .md details > summary { font-weight: 600; }
  .md a { color: var(--accent); }
  .md table { border-collapse: collapse; font-size: .9rem; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
  .hint-warning { color: var(--muted); font-size: .88rem; margin: 4px 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .pat { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; font-size: .92rem; }
  .cells { display: flex; gap: 4px; flex-wrap: wrap; }
  .cell { width: 16px; height: 16px; border-radius: 4px; background: var(--new); }
  .cell.learning { background: var(--learning); } .cell.review { background: var(--review); } .cell.mastered { background: var(--mastered); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--new); }
  .legend .l::before { background: var(--learning); } .legend .r::before { background: var(--review); } .legend .m::before { background: var(--mastered); }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .count { text-align: center; padding: 10px 4px; border-radius: 10px; background: var(--bg); }
  .count b { display: block; font-size: 1.4rem; line-height: 1.1; } .count span { color: var(--muted); font-size: .78rem; }
  .list { margin: 0; padding: 0; list-style: none; } .list li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .list li:first-child { border-top: 0; } .list .dim { color: var(--muted); }
  .done-state { text-align: center; padding: 28px 10px; }
  .done-state h2 { font-size: 1.4rem; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 18px; }
  .rating { background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: .92rem; margin-top: 10px; }
  .rating b { display: inline-block; width: 1.2em; }
  .block-label { color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px 2px; }
  .block-label b { color: var(--text); }
  .floor { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .92rem; margin-bottom: 14px; }
  .counted { background: color-mix(in srgb, var(--mastered) 14%, transparent); border-radius: 10px; padding: 10px 14px; font-size: .92rem; margin-bottom: 14px; }
  .quiz .q { padding: 10px 0; border-top: 1px solid var(--line); }
  .quiz .q:first-child { border-top: 0; }
  .quiz .q p { margin: 0 0 8px; font-weight: 600; }
  .quiz button { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; min-height: 44px; cursor: pointer; }
  .quiz button.right { border-color: var(--mastered); } .quiz button.wrong { border-color: var(--hard); }
  .quiz input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; min-height: 44px; }
  .quiz .why { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .quiz .result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-weight: 600; }
  .quiz .result code { font-weight: 400; }
  .cell.in_progress { background: var(--learning); } .cell.done { background: var(--mastered); } .cell.skipped { background: var(--line); }
  .cell.lab { border-radius: 50%; }
</style>
</head>
<body>
<main id="app"><div class="card">Loading…</div></main>
<script>
// --- a tiny markdown renderer: headings, fences, inline code, bold/italic, links, lists, tables, raw <details> blocks.
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, (_,c)=>"<code>"+c+"</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/→/g, "&rarr;");
  return s;
}
function md(src){
  const lines = src.replace(/\r/g,"").split("\n");
  let out = [], i = 0, list = null, para = [];
  const flushP = () => { if (para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para = []; } };
  const closeList = () => { if (list){ out.push("</"+list+">"); list = null; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^```/.test(l)){ flushP(); closeList(); let buf=[]; i++;
      while (i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>"); i++; continue; }
    if (/^<details>/.test(l.trim())){ flushP(); closeList();
      const sm = (lines[i+1]||"").match(/<summary>(.*?)<\/summary>/);
      let buf=[]; i += sm ? 2 : 1;
      while (i<lines.length && !/^<\/details>/.test(lines[i].trim())) buf.push(lines[i++]);
      out.push("<details><summary>"+inline(sm?sm[1]:"More")+"</summary><div>"+md(buf.join("\n"))+"</div></details>"); i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h){ flushP(); closeList(); out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"); i++; continue; }
    if (/^\|/.test(l)){ flushP(); closeList(); let rows=[];
      while (i<lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      rows = rows.filter(r=>!/^\|[\s:-|]+\|$/.test(r));
      out.push("<table>"+rows.map((r,ri)=>"<tr>"+r.replace(/^\||\|$/g,"").split("|").map(c=>(ri?"<td>":"<th>")+inline(c.trim())+(ri?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>"); continue; }
    const li = l.match(/^\s*([-*]|\d+\.)\s+(.*)/);
    if (li){ flushP(); const kind = /\d/.test(li[1]) ? "ol" : "ul";
      if (list !== kind){ closeList(); list = kind; out.push("<"+kind+">"); }
      out.push("<li>"+inline(li[2])+"</li>"); i++; continue; }
    if (!l.trim()){ flushP(); closeList(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flushP(); closeList();
  return out.join("\n");
}

// --- page
const KIND_LABEL = { new: "New problem", review: "Review · re-solve from blank", continue: "In progress",
                     build: "Build", checks: "Checks review · 5 min", mock: "Mock interview" };

function mockCard(m, d){
  return `
  <section class="card">
    <span class="kind mock">${KIND_LABEL.mock} · ${m.bell} min</span>
    <h2>${m.id} · ${esc(m.title)}</h2>
    <div class="meta"><span class="diff ${m.difficulty}">${m.difficulty}</span><span>${esc(m.pattern)}</span></div>
    <div class="ritual">Claude is the interviewer. You talk the whole time: restate, brute force out loud, optimize out loud, code, test one example, state complexity.
      <ol><li>in a session: <code>python3 coach.py mock</code></li><li>afterwards: <code>python3 coach.py mock done ${m.id} &lt;0-12&gt;</code></li></ol></div>
    <div class="rating">Graded 0 to 3 on communication, correctness, complexity analysis, code quality.</div>
  </section>`;
}

function minutesSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime())/60000) : null; }
function stripHead(mdText){ return mdText.replace(/^# .*\n/, "").replace(/^Pattern:.*\n/m,"").replace(/^LeetCode:.*\n/m,""); }
function split(mdText, marker){ const i = mdText.indexOf(marker); return i < 0 ? [mdText, ""] : [mdText.slice(0,i), mdText.slice(i)]; }

function problemCard(p, d){
  const [top, rest] = split(p.problem_md, "\n## Hints");
  const [hintsMd, explainMd] = split(rest, "\n## Explain it back");
  const elapsed = minutesSince(p.started_at);
  return `
  <section class="card">
    <span class="kind ${p.kind}">${KIND_LABEL[p.kind]}</span>
    <h2>${p.id} · ${esc(p.title)}</h2>
    <div class="meta">
      <span class="diff ${p.difficulty}">${p.difficulty}</span><span>${esc(p.pattern)}</span>
      ${p.kind === "review" ? `<span>last rated ${p.state.last_rating} on ${p.state.last_done}</span>` : ""}
      ${elapsed !== null ? `<span>${elapsed} min on the clock${elapsed >= p.bell ? " · past the bell, wrap up" : ""}</span>` : ""}
    </div>
    <div class="actions">
      <a class="btn" href="${p.url}" target="_blank" rel="noopener">Open on LeetCode</a>
      <a class="btn ghost" href="https://claude.ai/code" target="_blank" rel="noopener">Solve with Claude</a>
    </div>
    ${p.scaffolded ? "" : `<p class="hint-warning">Folder not filled in yet. Open a Claude session and say "leetcode"; it scaffolds first.</p>`}
    <div class="ritual">
      ${d.block_minutes} min timer, one more block allowed, hard stop at ${p.bell}. In a Claude session:
      <ol>
        <li><code>python3 coach.py start ${p.id}</code></li>
        <li>code in <code>problems/${p.id}-${p.slug}/solution.py</code></li>
        <li><code>python3 coach.py check ${p.id}</code></li>
        <li><code>python3 coach.py done ${p.id} &lt;1|2|3&gt;</code></li>
      </ol>
    </div>
    ${p.scaffolded ? `
    <details open><summary>The problem</summary><div class="md">${md(stripHead(top))}</div></details>
    <details><summary>Pattern: ${esc(p.pattern)}</summary><div class="md">${md(p.pattern_md)}</div></details>
    <details><summary>Hints</summary><p class="hint-warning">Open one at a time, only after 5 real minutes of being stuck.</p>
      <div class="md">${md(hintsMd.replace(/^\n?## Hints.*\n/, ""))}</div></details>
    <details><summary>Explain it back</summary><div class="md">${md(explainMd.replace(/^\n?## Explain it back.*\n/, ""))}</div></details>
    ` : `<details><summary>Pattern: ${esc(p.pattern)}</summary><div class="md">${md(p.pattern_md)}</div></details>`}
    <div class="rating">Rate it when done: <b>1</b> struggled or peeked · <b>2</b> solved with hints · <b>3</b> clean and explained back</div>
  </section>`;
}

function quizHtml(b){
  if (!b.checks || !b.checks.length) return "";
  const qs = b.checks.map((q, i) => {
    const body = (q.type || "choice") === "choice"
      ? q.options.map((o, j) => `<button data-q="${i}" data-j="${j}">${esc(o)}</button>`).join("")
      : `<input data-q="${i}" placeholder="type the answer, then Enter" autocomplete="off" autocapitalize="off">`;
    return `<div class="q" id="q-${b.id}-${i}"><p>${i+1}. ${inline(q.q)}</p>${body}<div class="why"></div></div>`;
  }).join("");
  return `<details><summary>Checks (${b.checks.length} quick questions)</summary>
    <p class="hint-warning">Practice here any time. To make it count, tell Claude your score, or take it in a session.</p>
    <div class="quiz" data-id="${b.id}">${qs}<div class="result" hidden></div></div></details>`;
}

function buildCard(b, d){
  const elapsed = minutesSince(b.started_at);
  const isChapter = b.item_kind === "chapter";
  const stepTxt = b.steps > 1 ? ` · step ${b.step + 1} of ${b.steps}` : "";
  const label = b.kind === "checks" ? KIND_LABEL.checks : (b.kind === "continue" ? "In progress" : (isChapter ? "Chapter" : "Lab"));
  const [chalTop, chalHints] = split(b.challenge_md || "", "\n## Hints");
  return `
  <section class="card">
    <span class="kind ${b.kind}">${label}</span>
    <h2>${b.id} · ${esc(b.title)}</h2>
    <div class="meta"><span>${esc(b.track)}</span><span>${stepTxt.replace(" · ","")}</span>
      ${b.state.checks_score ? `<span>checks ${b.state.checks_score}</span>` : ""}
      ${elapsed !== null ? `<span>${elapsed} min on the clock${elapsed >= b.bell ? " · past the bell" : ""}</span>` : ""}
    </div>
    ${b.scaffolded ? "" : `<p class="hint-warning">Not written yet. Open a Claude session and say "leetcode"; it fills this in first.</p>`}
    ${b.kind === "checks" ? quizHtml(b) : isChapter ? `
    <div class="ritual">${d.block_minutes} min timer. Read, checks, challenge. In a session:
      <ol><li><code>python3 coach.py start ${b.id}</code></li><li><code>python3 coach.py checks ${b.id}</code></li>
      <li>code in <code>${b.folder}/challenge.py</code>, then <code>python3 coach.py check ${b.id}</code></li>
      <li><code>python3 coach.py done ${b.id}</code></li></ol></div>
    ${b.scaffolded ? `<details open><summary>Read (5 min)</summary><div class="md">${md(b.read_md.replace(/^# .*\n/, ""))}</div></details>
    ${quizHtml(b)}
    <details><summary>Challenge</summary><div class="md">${md(chalTop.replace(/^# .*\n/, ""))}</div></details>
    <details><summary>Challenge hints</summary><p class="hint-warning">One at a time, after 5 real minutes.</p><div class="md">${md(chalHints.replace(/^\n?## Hints.*\n/, ""))}</div></details>` : ""}
    ` : `
    <div class="ritual">${d.block_minutes} min timer. Follow the step in README.md. In a session: <code>python3 coach.py start ${b.id}</code>, build, <code>python3 coach.py done ${b.id}</code>.</div>
    ${b.scaffolded ? `<details open><summary>Lab</summary><div class="md">${md(b.readme_md)}</div></details>` : ""}`}
  </section>`;
}

function wireQuizzes(d){
  document.querySelectorAll(".quiz").forEach(quiz => {
    const id = quiz.dataset.id;
    const block = d.plan.find(b => b.id === id && b.checks);
    const answered = {};
    const finish = () => {
      if (Object.keys(answered).length < block.checks.length) return;
      const score = Object.values(answered).filter(Boolean).length;
      const r = quiz.querySelector(".result"); r.hidden = false;
      r.innerHTML = `Score ${score}/${block.checks.length}. To record it, tell Claude: <code>checks ${id} ${score}/${block.checks.length}</code>`;
      try { localStorage.setItem("checks-"+id, JSON.stringify({score, total: block.checks.length, at: new Date().toISOString()})); } catch (e) {}
    };
    const show = (i, ok) => { const q = quiz.querySelector(`#q-${id}-${i} .why`); const c = block.checks[i];
      const ans = (c.type||"choice")==="choice" ? c.options[c.answer] : c.answers[0];
      q.textContent = (ok ? "Right. " : `Not quite. Answer: ${ans}. `) + (c.why || ""); };
    quiz.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      const i = +btn.dataset.q; if (i in answered) return;
      const ok = +btn.dataset.j === block.checks[i].answer; answered[i] = ok;
      btn.classList.add(ok ? "right" : "wrong");
      if (!ok) quiz.querySelector(`#q-${id}-${i} button:nth-of-type(${block.checks[i].answer+1})`).classList.add("right");
      show(i, ok); finish();
    }));
    quiz.querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", e => {
      if (e.key !== "Enter") return; const i = +inp.dataset.q; if (i in answered) return;
      const ok = block.checks[i].answers.map(a => a.toLowerCase().trim()).includes(inp.value.toLowerCase().trim());
      answered[i] = ok; inp.classList.add(ok ? "right" : "wrong"); inp.disabled = true; show(i, ok); finish();
    }));
  });
}

function render(d){
  const app = document.getElementById("app");
  let html = `<header><h1>Coach</h1><span class="streak">${d.today} · streak ${d.streak}</span></header>`;
  if (d.counted_today) html += `<div class="counted">Today already counts. Everything below is bonus. Stopping is a fine choice.</div>`;
  if (!d.plan.length){
    html += `<section class="card done-state"><h2>Done for today.</h2><p class="dim">Nothing left. Tomorrow has its own.</p></section>`;
  } else {
    d.plan.forEach((b, i) => {
      const tag = (i === 0 && !d.counted_today) ? "<b>counts for today</b>" : "bonus";
      const mins = b.kind === "checks" ? 5 : b.type === "mock" ? b.bell : (b.type === "problem" ? `${d.block_minutes}, up to ${b.bell}` : d.block_minutes);
      html += `<p class="block-label">Block ${i+1} · ${mins} min · ${tag}</p>`;
      html += b.type === "problem" ? problemCard(b, d) : b.type === "mock" ? mockCard(b, d) : buildCard(b, d);
    });
  }
  html += `<div class="floor"><b>Bad day?</b> ${esc(d.floor)} Five minutes still counts.</div>`;
  html += `<section class="card">
    <div class="counts">${["new","learning","review","mastered"].map(k=>`<div class="count"><b>${d.counts[k]}</b><span>${k}</span></div>`).join("")}</div>
    ${(d.tiers||[]).length ? `<ul class="list">${d.tiers.map(t=>`<li><span>tier ${t.tier} · ${esc(t.name)}${t.tier===d.current_tier?" · <b>current</b>":""}</span><span class="dim">${t.total - t.counts.new} / ${t.total}</span></li>`).join("")}</ul>` : ""}
    ${(d.queue||[]).length ? `<p class="hint-warning">queued next: ${d.queue.join(", ")}</p>` : ""}
    <p class="hint-warning">map of tier ${d.current_tier||1}</p>
    <div class="grid">${d.patterns.map(p=>`<div class="pat"><span>${esc(p.name)}</span><div class="cells">${p.problems.map(q=>`<a class="cell ${q.status}" href="${q.url}" title="${q.id} ${esc(q.title)} (${q.status})" target="_blank" rel="noopener"></a>`).join("")}</div></div>`).join("")}</div>
    <div class="legend"><span>not started</span><span class="l">learning</span><span class="r">in review rotation</span><span class="m">mastered</span></div>
  </section>`;
  html += `<section class="card"><div class="grid">${d.tracks.map(t=>`<div class="pat"><span>${esc(t.name)}</span><div class="cells">${t.items.map(q=>`<span class="cell ${q.status} ${q.kind}" title="${q.id} ${esc(q.title)} (${q.status})"></span>`).join("")}</div></div>`).join("")}</div>
    <div class="legend"><span>not started</span><span class="l">in progress</span><span class="m">done</span><span>&#9675; labs are round</span></div></section>`;
  if (d.upcoming.length || d.recent.length){
    html += `<section class="card">`;
    if (d.upcoming.length) html += `<details><summary>Upcoming</summary><ul class="list">${d.upcoming.map(u=>`<li><span>${u.id} ${esc(u.title)} · ${u.what}</span><span class="dim">${u.due}</span></li>`).join("")}</ul></details>`;
    if (d.recent.length) html += `<details><summary>Recent</summary><ul class="list">${d.recent.map(r=>`<li><span>${r.day} · ${esc(r.title||"")}</span><span class="dim">${r.kind}${r.rating?" · rated "+r.rating:""}${r.score!=null?" · "+r.score+"/"+r.total:""}${r.minutes!=null?" · "+r.minutes+" min":""}</span></li>`).join("")}</ul></details>`;
    html += `</section>`;
  }
  html += `<footer>as of ${d.generated_at.replace("T"," ")} · regenerates each morning and after each session</footer>`;
  app.innerHTML = html;
  wireQuizzes(d);
}

fetch("data.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(e => {
  document.getElementById("app").innerHTML = `<div class="card">Couldn't load data.json. ${esc(String(e))}</div>`;
});
</script>
</body>
</html>
